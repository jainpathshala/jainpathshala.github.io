<script>// Storage for the Jainism Learn app. Adapted from storylearn src/js/store.js (see UPSTREAM.md).
// REG is the only list of what the app saves: Reset clears class 'progress' (settings stay), Delete all clears everything,
// Export/Import and the Privacy list are built from it. Add every new key here (scripts/test_learn.js checks the engine against it).
const NS = 'jainlearn:', STORE_VERSION = 1;
const ls = {
  get(k){ try { return localStorage.getItem(NS+k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(NS+k, v); } catch(e){ const n = typeof document !== 'undefined' && document.getElementById('savenote'); if (n) n.hidden = false; } },
  del(k){ try { localStorage.removeItem(NS+k); } catch(e){} }
};
const isFlag = v => v === '1', isInt = v => /^\d+$/.test(v);
const isObj = v => { try { const o = JSON.parse(v); return !!o && typeof o === 'object'; } catch(e){ return false; } };
const oneOf = (...a) => v => a.includes(v);
const REG = [
  {n:'pos', cls:'progress', label:'pv_pos', re:/^pos:.+$/, ok:isInt},
  {n:'done', cls:'progress', label:'pv_fin', re:/^done$/, ok:isObj},
  {n:'qok', cls:'progress', label:'pv_fin', re:/^qok$/, ok:isObj},
  {n:'mod', cls:'progress', label:'pv_fin', re:/^mod$/, ok:isObj},
  {n:'review', cls:'progress', label:'pv_rev', re:/^review$/, ok:isObj},
  {n:'lang', cls:'setting', label:'pv_set', re:/^lang$/, ok:oneOf('en','hi')},
  {n:'theme', cls:'setting', label:'pv_set', re:/^theme$/, ok:oneOf('system','light','dark')},
  {n:'text', cls:'setting', label:'pv_set', re:/^text$/, ok:oneOf('100','115','130')},
  {n:'spacing', cls:'setting', label:'pv_set', re:/^spacing$/, ok:oneOf('normal','roomy')},
  {n:'cvd', cls:'setting', label:'pv_set', re:/^cvd$/, ok:oneOf('on','off')},
  {n:'rn', cls:'setting', label:'pv_set', re:/^rn$/, ok:oneOf('3','5','10')},
  {n:'rp', cls:'setting', label:'pv_set', re:/^rp$/, ok:oneOf('on','off')},
  {n:'v', cls:'meta', label:'', re:/^v$/, ok:isInt}
];
const privacyKeys = () => [...new Set(REG.map(e => e.label).filter(Boolean))];
const storedKeys = () => { try { return Object.keys(localStorage).filter(k => k.startsWith(NS)); } catch(e){ return []; } };
const entryOf = k => REG.find(e => e.re.test(k.slice(NS.length)));
// Migration: version 1 is the first registry; the shape of every key is unchanged, so only the version is stamped.
// Later versions add steps here that copy old keys to new names, check the copy, then remove the old key (safe to rerun).
function migrateStore(){ try { if (localStorage.getItem(NS+'v') !== String(STORE_VERSION)) localStorage.setItem(NS+'v', String(STORE_VERSION)); } catch(e){} }
const getJ = (k,d) => { try { return JSON.parse(ls.get(k)) || d; } catch(e){ return d; } };
const store = {
  done: id => !!getJ('done',{})[id], setDone(id){ const d=getJ('done',{}); d[id]=1; ls.set('done',JSON.stringify(d)); },
  qok: id => !!getJ('qok',{})[id], setQ(id){ const d=getJ('qok',{}); d[id]=1; ls.set('qok',JSON.stringify(d)); },
  clearQ(ids){ const d=getJ('qok',{}); ids.forEach(i=>delete d[i]); ls.set('qok',JSON.stringify(d)); },
  pdone: id => !!getJ('mod',{})[id], setPdone(id){ const d=getJ('mod',{}); d[id]=1; ls.set('mod',JSON.stringify(d)); },
  pos: id => +ls.get('pos:'+id) || 0, setPos(id,p){ ls.set('pos:'+id,String(p)); },
  clear(){ storedKeys().filter(k => { const e = entryOf(k); return !e || e.cls === 'progress'; }).forEach(k => { try { localStorage.removeItem(k); } catch(e){} }); },
  clearAll(){ storedKeys().forEach(k => { try { localStorage.removeItem(k); } catch(e){} }); },
  // Export: one JSON object with every registered key except the version (names without the prefix).
  exportData(){ const data = {};
    storedKeys().forEach(k => { const e = entryOf(k); if (e && e.cls !== 'meta') { const v = ls.get(k.slice(NS.length)); if (v !== null) data[k.slice(NS.length)] = v; } });

  } else if (q.type === 'order'){
    let picked = [];
    const draw = () => { root.innerHTML = `<p class="rule">${T('tap_lines')}</p><ol class="seq mine" aria-label="${T('your_order')}">${picked.map((x,i)=>`<li data-n="${i+1}" lang="sa" class="dv">${esc(q.items[x])}</li>`).join('')}</ol><ul class="seq">${q.items.map((x,i)=>picked.includes(i)?'':`<li style="padding:0"><button data-i="${i}" lang="sa" class="dv" style="width:100%;text-align:left;box-shadow:none;border:0">${esc(x)}</button></li>`).join('')}</ul><div class="row"><button id="chk" class="primary" ${picked.length===q.items.length?'':'disabled'}>${T('check')}</button><button id="rst">${T('reset_order')}</button></div><div id="qf" aria-live="polite"></div>`;
      root.querySelectorAll('.seq button').forEach(b => b.onclick = () => { picked.push(+b.dataset.i); draw(); });
      $('rst').onclick = () => { picked = []; draw(); };
      $('chk').onclick = () => { const ok = picked.every((x,i)=>q.items[x]===q.answer[i]);
        $('qf').innerHTML = ok ? `<div class="fb ok"><strong>✓ ${T('correct')}.</strong></div>` : `<div class="fb no"><strong>✗ ${T('notquite')}.</strong> ${T('see_verse')}.</div>`; mark(ok); }; };
    draw();
  } else if (q.type === 'recall'){
    let mode = 'read', rev = 0; const n = L.lines.length;
    const draw = () => {
      const verse = mode === 'read' ? verseHtml(L, false)
        : `<div class="verse-box" lang="sa">${L.lines.map((x,i)=> i < rev ? `<p class="verse">${esc(x)}</p>` : `<button type="button" class="line-hide" data-i="${i}" aria-label="${T('line')} ${i+1}: ${T('reveal_line')}">${T('line')} ${i+1} ·  ${T('reveal_line')}</button>`).join('')}</div>`;
      root.innerHTML = `<p class="rule">${T('recall_intro')}</p>${verse}<div class="row">`
        + (mode === 'read' ? `<button id="tg" class="primary">${T('hide_verse')}</button>`
          : `<button id="nl" ${rev>=n?'disabled':''}>${T('next_line')}</button><button id="sa" ${rev>=n?'disabled':''}>${T('show_all')}</button><button id="rd">${T('show_verse')}</button>`)
        + `</div><div class="row"><button class="primary" id="ok">${T('recalled')}</button><button id="ag">${T('again')}</button></div><div id="qf" aria-live="polite"></div>`;
      if ($('tg')) $('tg').onclick = () => { mode = 'hide'; rev = 0; draw(); };
      if ($('nl')) $('nl').onclick = () => { rev++; draw(); };
      if ($('sa')) $('sa').onclick = () => { rev = n; draw(); };
      if ($('rd')) $('rd').onclick = () => { mode = 'read'; draw(); };
      root.querySelectorAll('.line-hide').forEach(b => b.onclick = () => { rev = Math.max(rev, +b.dataset.i + 1); draw(); });
      $('ok').onclick = () => { $('qf').innerHTML = `<div class="fb ok"><strong>✓ ${T('practised')}.</strong></div>`; mark(true); };
      $('ag').onclick = () => { if (practiceMode === 'review') mark(false); mode = 'read'; draw(); };
    };
    draw();
  }
}

function practice(i){
  view = {v:'practice'}; const main = $('main'); setChrome(true);
  const pool = LESSONS.flatMap(l=>l.practice);
  if (!PR){ const a = pool.slice(); for (let k=a.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } PR = {items:a.slice(0,Math.min(8,a.length)), right:0, first:{}}; }
  const n = PR.items.length;
  if (i >= n){
    setProgress(100, T('n_of',{n:n,t:n}));
    main.innerHTML = `<p class="kicker">${T('pr_end')}</p><h1>${T('summary_title')}</h1><div class="card"><p>${PR.right} ${T('of')} ${n} ${T('pr_right')}.</p></div><div class="nav"><button id="back">${T('retest')}</button><button class="primary" id="mk">${T('mark_module')}</button></div>`;
    $('back').onclick = () => { PR = null; practice(0); }; $('mk').onclick = () => { store.setPdone(MOD.id); go('celebrate', {kind:'module'}); }; focusHead(); return;
  }
  setProgress(i/n*100, T('n_of',{n:i+1,t:n}));
  const q = PR.items[i]; let answered = false;
  main.innerHTML = `<p class="kicker">${T('practice')} · ${T('q_word')}</p>${i===0?`<p class="rule">${T('practice_intro')}</p>`:''}<div class="card"><div id="w"></div></div>${nav(i>0, 0, i===n-1?T('to_summary'):T('next'), true)}`;
  questionWidget($('w'), q, ok => { if (!(q.id in PR.first)){ PR.first[q.id]=ok; if (ok) PR.right++; } if (ok) $('next').disabled = false; }, true);
  $('next').onclick = () => practice(i+1); if ($('back')) $('back').onclick = () => practice(i-1); focusHead();
}

function celebrate(kind, id){
  const main = $('main'); let kick, title, lines, pri, sec; view = {v:'celebrate', arg:{kind,id}};
  if (kind === 'lesson'){ kick = T('lesson_complete'); title = `${T('verse')} ${L.no}`;
    lines = `<p><strong>${T('you_can')}</strong></p><ul><li>${T('can1',{n:L.no})}</li><li>${T('can2')}</li><li>${T('can3')}</li></ul><p class="rule">${T('reflect')}</p>`;
    pri = [T('back_module'), () => go('module')]; sec = null;
  } else { kick = T('module_complete'); title = T('module'); lines = `<p>${T('practice_sub')}.</p>`; pri = [T('back_home'), () => go('home')]; sec = [T('back_module'), () => go('module')]; }
  setChrome(false);
  main.innerHTML = `<div class="cele"><div class="bigring" aria-hidden="true">✓</div><p class="kicker">${kick}</p><h1>${esc(title)}</h1><div class="card">${lines}</div><p class="rule">${T('saved')}</p></div><div class="nav">${sec?`<button id="csec">${sec[0]}</button>`:'<span></span>'}<button class="primary" id="cpri">${pri[0]}</button></div>`;
  $('cpri').onclick = pri[1]; if (sec) $('csec').onclick = sec[1]; focusHead();
}

$('exit').onclick = () => { if (view.v==='lesson' || view.v==='practice' || view.v==='celebrate' || view.v==='resume') go('module'); else if (view.v==='module' || view.v==='privacy' || view.v==='review') { RV = null; go(view.v==='review' ? 'module' : 'home'); } };
document.addEventListener('keydown', e => { if (e.altKey||e.ctrlKey||e.metaKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const b = $(e.key==='ArrowRight'?'next':e.key==='ArrowLeft'?'back':''); if (b && !b.disabled){ e.preventDefault(); b.click(); } });

// Settings: theme, colour-blind friendly colours, text size, line spacing, language (this device only)
function settingsHtml(){
  const seg = (label, attr, opts) => `<div class="row"><span>${label}</span><span class="seg" role="group" aria-label="${label}">${opts.map(o=>`<button type="button" data-${attr}="${o[0]}">${o[1]}</button>`).join('')}</span></div>`;
  $('settings').innerHTML = `<div class="row shead"><h2 id="settings-title">${T('settings')}</h2><button type="button" id="settings-close">${T('close').replace('✕ ','')}</button></div>`
    + seg(T('language'),'lg',[['en','English'],['hi','हिन्दी']]) + seg(T('appearance'),'th',[['system',T('sys')],['light',T('light')],['dark',T('dark')]])
    + seg(T('colours'),'cv',[['off',T('std')],['on',T('cvd')]]) + seg(T('textsize'),'ts',[['100',T('std')],['115',T('larger')],['130',T('largest')]]) + seg(T('spacing'),'sp',[['normal',T('std')],['roomy',T('roomy')]])
    + seg(T('review_daily'),'rn',[['3','3'],['5','5'],['10','10']]) + seg(T('review_pause'),'rp',[['on',T('on')],['off',T('off')]])
    + `<div class="row"><button type="button" id="privacylink">${T('privacy')}</button><button type="button" id="export">${T('export')}</button><button type="button" id="import">${T('import')}</button><input type="file" id="loadfile" accept="application/json,.json" hidden></div><p class="rule" id="datamsg" role="status"></p>`
    + `<div class="row"><button type="button" id="reset">${T('reset')}</button><button type="button" id="wipe">${T('wipe')}</button></div>`;
  const r = document.documentElement, mq = window.matchMedia('(prefers-color-scheme: dark)'), g = (k,d)=>ls.get(k)||d, all = s => document.querySelectorAll(s);
  const apply = () => { const t = g('theme','system'), dark = t==='dark' || (t==='system' && mq.matches);
    dark ? r.setAttribute('data-theme','dark') : r.removeAttribute('data-theme'); g('cvd','off')==='on' ? r.setAttribute('data-cvd','on') : r.removeAttribute('data-cvd');
    r.style.fontSize = g('text','100')+'%'; r.setAttribute('data-lh', g('spacing','normal'));
    const pr = (a,v) => all(`[data-${a}]`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset[a]===v)));
    pr('th',t); pr('cv',g('cvd','off')); pr('ts',g('text','100')); pr('sp',g('spacing','normal')); pr('lg',LANG); pr('rn',g('rn','5')); pr('rp',g('rp','on')); };
  const bind = (a,k) => all(`[data-${a}]`).forEach(b => b.onclick = () => { ls.set(k,b.dataset[a]); apply(); });
  bind('th','theme'); bind('cv','cvd'); bind('ts','text'); bind('sp','spacing'); bind('rn','rn'); bind('rp','rp');
  all('[data-lg]').forEach(b => b.onclick = () => { LANG = b.dataset.lg; ls.set('lang',LANG); settingsHtml(); setChrome(view.v==='lesson'); if (view.v==='lesson') render(); else if (view.v==='practice') practice(0); else go(view.v, view.arg); });
  mq.addEventListener && mq.addEventListener('change', apply); apply();
  $('settings-close').onclick = () => $('settings').close();
  $('reset').onclick = () => askConfirm(T('reset_title'), T('reset_q'), T('reset_ok'), () => { store.clear(); RV = null; $('settings').close(); go('home'); });
  $('wipe').onclick = () => askConfirm(T('wipe_title'), T('wipe_q'), T('wipe_ok'), () => { store.clearAll(); try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} location.reload(); });
  $('privacylink').onclick = () => { $('settings').close(); go('privacy'); };
  const dmsg = t => { $('datamsg').textContent = t; };
  $('export').onclick = () => { try { const blob = new Blob([JSON.stringify(store.exportData(), null, 1)], {type:'application/json'}), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'jain-pathshala-data-' + new Date().toISOString().slice(0,10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); dmsg(T('export_ok')); } catch(e){ dmsg(T('export_fail')); } };
  $('import').onclick = () => { dmsg(''); $('loadfile').click(); };
  $('loadfile').onchange = async e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    let res; try { res = store.parseImport(await f.text()); } catch(x){ res = {ok:false, why:'unreadable'}; }
    if (!res.ok){ dmsg(res.why === 'newer' ? T('import_newer') : T('import_bad')); return; }
    askConfirm(T('import_title'), T('import_q'), T('import_ok'), () => { store.applyImport(res.data); LANG = ls.get('lang') || 'en'; RV = null; settingsHtml(); dmsg(T('import_done')); go('home'); }); };
}
$('gear').onclick = () => $('settings').showModal();
// In-app confirm dialog: Cancel has focus first, Esc cancels, focus returns to the button that opened it.
function askConfirm(title, text, okLabel, onOk){
  const d = $('confirmd'); $('cd-title').textContent = title; $('cd-text').textContent = text; $('cd-cancel').textContent = T('cancel'); const ok = $('cd-ok'); ok.textContent = okLabel;
  ok.onclick = () => { d.close(); onOk(); }; $('cd-cancel').onclick = () => d.close(); d.showModal(); $('cd-cancel').focus();
}
$('settings').addEventListener('close', () => { if (!document.activeElement || document.activeElement === document.body) $('gear').focus(); });
settingsHtml(); applyRoute(routeIn() || 'home');
</script>
</body>
</html>
